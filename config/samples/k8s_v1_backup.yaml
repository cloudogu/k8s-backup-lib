apiVersion: k8s.cloudogu.com/v1
kind: Backup
metadata:
  labels:
    app.kubernetes.io/name: backup
    app.kubernetes.io/instance: backup-sample
    app.kubernetes.io/part-of: k8s-backup-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: k8s-backup-operator
  name: backup-sample
spec:
  provider: velero
  excludedDogus:
    - redmine
  excludedComponents:
    - k8s-prometheus
  options:
    ignoreGlobalConfig: false
    ignoreV2Dogus: false
    ignoreMisc: true
    failureMode: partiallyAllowed
