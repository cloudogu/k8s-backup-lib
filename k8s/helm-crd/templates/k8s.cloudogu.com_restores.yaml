              properties:
                backupName:
                  description: BackupName references the backup that should be restored.
                  type: string
                excludedComponents:
                  description: ExcludedComponents contains the names of components whose resources are not restored.
                  items:
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: set
