  name: restores.k8s.cloudogu.com
spec:
  group: k8s.cloudogu.com
  names:
    kind: Restore
    listKind: RestoreList
    plural: restores
    singular: restore
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: The backup name for the restore
          jsonPath: .spec.backupName
          name: Backup name
          type: string
        - description: Whether the restore is already completed successfully. False shows a failure.
          jsonPath: .status.conditions[?(@.type=='Succeeded')].status
          name: Succeeded
          type: string
        - description: Whether all preparations for the restore are completed
          jsonPath: .status.conditions[?(@.type=='Prepared')].status
          name: Prepared
          type: string
        - description: Whether the backup provider finished the restore process successfully. False shows a failure.
          jsonPath: .status.conditions[?(@.type=='ProviderSucceeded')].status
          name: ProviderSucceeded
          type: string
        - description: Whether the post restore workload operations are completed
          jsonPath: .status.conditions[?(@.type=='WorkloadsRecovered')].status
          name: WorkloadsRecovered
          type: string
        - description: The age of the resource
          jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
