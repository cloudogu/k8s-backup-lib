---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    app: ces
    app.kubernetes.io/name: k8s-backup-operator-crd
    k8s.cloudogu.com/part-of: backup
  name: backups.k8s.cloudogu.com
spec:
  group: k8s.cloudogu.com
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: The completion timestamp of the backup
          jsonPath: .status.completionTimestamp
          name: Completion Timestamp
          type: string
        - description: The age of the resource
          jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - description: Whether the backup is completed
          jsonPath: .status.conditions[?(@.type=='Succeeded')].status
          name: Succeeded
          type: string
        - description: Whether all preparations for the backup are completed
          jsonPath: .status.conditions[?(@.type=='Prepared')].status
          name: Prepared
          type: string
        - description: Whether the provider backup is completed
          jsonPath: .status.conditions[?(@.type=='ProviderSucceeded')].status
          name: ProviderSucceeded
          type: string
        - description: Whether the backup is canceled
          jsonPath: .status.conditions[?(@.type=='Canceled')].status
          name: Canceled
          type: string
        - description: Whether the backup is deleting
          jsonPath: .status.conditions[?(@.type=='Deleting')].status
          name: Deleting
          type: string
      name: v1
      schema:
        openAPIV3Schema:
          description: Backup is the Schema for the backups API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: Spec defines the desired state of Backup
              properties:
                provider:
                  description: Provider defines the backup provider which should be used for the backup.
                  enum:
                    - velero
                  type: string
                syncedFromProvider:
                  description: |-
                    SyncedFromProvider defines that this backup already exists in the provider and its status should be synced.
                    This is necessary because we cannot set the status of a backup on creation, see:
                    https://stackoverflow.com/questions/73574615/how-to-create-kubernetes-objects-with-status-fields
                  type: boolean
              type: object
            status:
              description: Status defines the observed state of Backup
              properties:
                completionTimestamp:
                  description: CompletionTimestamp marks the date/time when the backup finished being processed, regardless of any errors.
                  format: date-time
                  type: string
                conditions:
                  description: Conditions represent the latest available observations of the Backup's state.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
