                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: set
                options:
                  description: Options defines which units are backed up and how failed units are handled.
                  properties:
