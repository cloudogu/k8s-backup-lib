kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    app: ces
    app.kubernetes.io/name: k8s-backup-operator-crd
    k8s.cloudogu.com/part-of: backup
  name: backups.k8s.cloudogu.com
spec:
  group: k8s.cloudogu.com
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: The completion timestamp of the backup
          jsonPath: .status.completionTimestamp
          name: Completion Timestamp
          type: string
        - description: The age of the resource
          jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - description: Whether the backup is completed
          jsonPath: .status.conditions[?(@.type=='Succeeded')].status
          name: Succeeded
          type: string
        - description: Whether all preparations for the backup are completed
          jsonPath: .status.conditions[?(@.type=='Prepared')].status
          name: Prepared
          type: string
        - description: Whether the provider backup is completed
          jsonPath: .status.conditions[?(@.type=='ProviderSucceeded')].status
