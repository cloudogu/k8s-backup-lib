              properties:
                excludedComponents:
                  description: ExcludedComponents contains the names of components whose resources are not backed up.
                  items:
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  maxItems: 256
                  type: array
