          type: string
        - description: Whether the backup is canceled
          jsonPath: .status.conditions[?(@.type=='Canceled')].status
          name: Canceled
          type: string
        - description: Whether the backup is deleting
          jsonPath: .status.conditions[?(@.type=='Deleting')].status
          name: Deleting
          type: string
        - description: Whether the backup contains the whole system
          jsonPath: .status.backupCoverage
          name: Coverage
          type: string
      name: v1
      schema:
